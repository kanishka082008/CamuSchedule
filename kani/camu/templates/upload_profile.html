{% load static %}
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Upload profile</title>
</head>
<body>
    <h2>Upload profile picture</h2>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <input type="file" name="image" accept="image/*" required>
        <button type="submit">Upload</button>
    </form>
    <p><a href="/">Back</a></p>
</body>
</html>
